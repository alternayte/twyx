name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fast:
    name: fast (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-deny
      - uses: Swatinem/rust-cache@v2
      # The terminal engine, libghostty-vt, builds with Zig 0.16.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      # The Neovim conformance cases need Neovim 0.11 or later on PATH.
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      # checks/linux-target.sh type-checks the Linux build from macOS too.
      - run: rustup target add x86_64-unknown-linux-gnu
      - run: just check

  full:
    name: full (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
      # The terminal engine, libghostty-vt, builds with Zig 0.16.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      # The Neovim conformance cases need Neovim 0.11 or later on PATH.
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - run: just test

