name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fast:
    name: fast (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-deny
      - uses: Swatinem/rust-cache@v2
      # The desktop client's Linux backends link these.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev
      # The terminal engine, libghostty-vt, builds with Zig 0.16.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      # The Neovim conformance cases need Neovim 0.11 or later on PATH.
      - name: Neovim
        run: |
          case "$RUNNER_OS-$(uname -m)" in
            Linux-x86_64) asset=nvim-linux-x86_64 ;;
            macOS-arm64) asset=nvim-macos-arm64 ;;
            *) echo "no Neovim asset for $RUNNER_OS-$(uname -m)" >&2; exit 1 ;;
          esac
          curl -fsSL "https://github.com/neovim/neovim/releases/download/stable/$asset.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$asset/bin" >> "$GITHUB_PATH"
      # checks/linux-target.sh type-checks the Linux build from macOS too.
      - run: rustup target add x86_64-unknown-linux-gnu
      - run: just check

  full:
    name: full (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
      # The desktop client's Linux backends link these.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev
      # The terminal engine, libghostty-vt, builds with Zig 0.16.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      # The Neovim conformance cases need Neovim 0.11 or later on PATH.
      - name: Neovim
        run: |
          case "$RUNNER_OS-$(uname -m)" in
            Linux-x86_64) asset=nvim-linux-x86_64 ;;
            macOS-arm64) asset=nvim-macos-arm64 ;;
            *) echo "no Neovim asset for $RUNNER_OS-$(uname -m)" >&2; exit 1 ;;
          esac
          curl -fsSL "https://github.com/neovim/neovim/releases/download/stable/$asset.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$asset/bin" >> "$GITHUB_PATH"
      - run: just test

