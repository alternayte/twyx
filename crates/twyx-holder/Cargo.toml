[package]
name = "twyx-holder"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["engine-alacritty"]
engine-alacritty = ["dep:alacritty_terminal"]
engine-ghostty = ["dep:libghostty-vt"]
engine-wezterm = ["dep:wezterm-term"]

[dependencies]
alacritty_terminal = { version = "0.26", optional = true }
anyhow = "1"
libghostty-vt = { git = "https://github.com/uzaaft/libghostty-rs.git", rev = "d2036baeb6", optional = true }
portable-pty = "0.9"
rustix = { version = "1", features = ["process"] }
wezterm-term = { git = "https://github.com/wezterm/wezterm.git", rev = "e2a98e1b8af156988ad0ac778658ac27b60a55fb", optional = true }
twyx-core = { workspace = true }
twyx-protocol = { workspace = true }
