[package]
name = "twyx-desktop"
version.workspace = true
edition.workspace = true
rust-version = "1.98"
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1"
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["font-kit", "wayland", "x11"] }
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
twyx-core = { workspace = true }
twyx-protocol = { workspace = true }

[[test]]
name = "text_system"
harness = false

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.9", features = ["test-support"] }
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["font-kit", "wayland", "x11", "test-support"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSDockTile", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
