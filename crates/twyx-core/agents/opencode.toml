title = "OpenCode"
processes = ["opencode"]
command = ["opencode"]
launch_with_prompt = ["opencode", "--prompt", "{prompt}"]
resume = ["opencode", "--session", "{session}"]
integration = "opencode"

[[screen]]
name = "permission dialog"
state = "awaiting-approval"
all = ['△ Permission required']
any = ['Allow once', 'enter confirm']

[[screen]]
name = "update dialog"
state = "awaiting-approval"
all = ['Update Available', 'Confirm']

[[screen]]
name = "interrupt hint"
state = "working"
rows = 3
all = ['esc interrupt']

[[screen]]
name = "input box"
state = "awaiting-prompt"
# A tip can sit under the box on the start screen.
rows = 5
all = ['^\s*╹▀{20,}']
